<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>SpringEduManager - Iniciar sesión</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            background-color: white;
            width: 360px;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.10);
        }

        .titulo {
            text-align: center;
            margin-bottom: 30px;
        }

        .titulo h1 {
            margin-bottom: 8px;
            color: #2f6fed;
        }

        .titulo p {
            margin: 0;
            color: #666;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 7px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 11px;
            border: none;
            border-radius: 7px;
            background-color: #2f6fed;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2459bd;
        }

        .error {
            background-color: #ffeaea;
            color: #b42318;
            padding: 10px;
            border-radius: 7px;
            margin-bottom: 15px;
            text-align: center;
        }

        .logout {
            background-color: #eaf7ee;
            color: #237a3b;
            padding: 10px;
            border-radius: 7px;
            margin-bottom: 15px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="titulo">
            <h1>SpringEduManager</h1>
            <p>Gestión educativa</p>
        </div>

        <div th:if="${param.error}" class="error">
            Usuario o contraseña incorrectos.
        </div>

        <div th:if="${param.logout}" class="logout">
            Sesión cerrada correctamente.
        </div>

        <form th:action="@{/login}" method="post">

            <label>Usuario</label>
            <input type="text"
                   name="username"
                   placeholder="Ingresa tu usuario"
                   required>

            <label>Contraseña</label>
            <input type="password"
                   name="password"
                   placeholder="Ingresa tu contraseña"
                   required>

            <button type="submit">
                Iniciar sesión
            </button>

        </form>

    </div>

</body>
</html>
